name: Build and Push Docker Images

#exclude the features directory from the workflow

on:
  push:
    branches: [ main ]
    paths:
      - '**/Dockerfile'
      - '.github/workflows/build-images.yml'
      - '!features/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Dockerfile'
      - '.github/workflows/build-images.yml'
      - '!features/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/devcontainers

jobs:
  detect-images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect Docker images
        id: detect
        run: |
          # Find all directories containing Dockerfile
          # exclude features directory
          IMAGES=$(find . -name "Dockerfile" -not -path "./.git/*" -not -path "./features/*" | xargs -I {} dirname {} | sed 's|^\./||' | sort)

          # remove base and lite from list
          IMAGES=$(echo "$IMAGES" | grep -v -E '^(base|lite)$')
          # Convert to JSON array
          IMAGES_JSON=$(echo "$IMAGES" | jq -R -s -c 'split("\n")[:-1]')
          
          echo "images=$IMAGES_JSON" >> $GITHUB_OUTPUT
          echo "Detected images: $IMAGES_JSON"

  build-foundation-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      -
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

        #login to registry
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        # Docker tags can't contain "/", which PR refs ("1/merge") and some branch names do.
      - name: Safe ref name
        id: ref
        run: echo "name=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-')" >> $GITHUB_OUTPUT

        # build lite image
      - name: Build lite image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./lite/Dockerfile
          platforms: linux/amd64,linux/arm64
          # PRs only check that the image builds; they must not overwrite :latest.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-lite:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-lite:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-lite:${{ github.sha }}-${{ steps.ref.outputs.name }}

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-base:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-base:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-base:${{ github.sha }}-${{ steps.ref.outputs.name }}

  build-and-push:
    needs: [detect-images, build-foundation-images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      # One broken image shouldn't cancel the others.
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-images.outputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      -
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate safe image name
        id: safe-name
        run: |
          # Replace forward slashes with hyphens for Docker image names
          SAFE_IMAGE_NAME=$(echo "${{ matrix.image }}" | sed 's/\//-/g')
          echo "safe_name=$SAFE_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Original image path: ${{ matrix.image }}"
          echo "Safe image name: $SAFE_IMAGE_NAME"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.safe-name.outputs.safe_name }}-{{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: Read platforms
        id: platforms
        run: |
          # An image folder can override the default platforms with a "platforms" file.
          if [ -f "${{ matrix.image }}/platforms" ]; then
            echo "value=$(tr -d '[:space:]' < "${{ matrix.image }}/platforms")" >> $GITHUB_OUTPUT
          else
            echo "value=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

      - name: Generate version
        id: version
        run: |
          # Generate a version based on date and commit
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION="${DATE}-${SHORT_SHA}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.image }}/Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}:${{ steps.safe-name.outputs.safe_name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }} devcontainer
            org.opencontainers.image.description=Devcontainer image for ${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Generate build report
        run: |
          # Create build report and append to step summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          
          ## 🐳 DevContainer: ${{ matrix.image }}
          
          | Field | Value |
          |-------|-------|
          | **Status** | ✅ **SUCCESS** |
          | **Version** | \`${{ steps.version.outputs.version }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Build Date** | \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\` |
          
          ### 🏷️ Image Tags
          - \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}:latest\`
          - \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}:${{ steps.safe-name.outputs.safe_name }}-${{ github.sha }}\`
          
          ### 🚀 Usage
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}:latest
          docker run -it --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ steps.safe-name.outputs.safe_name }}:latest
          \`\`\`
          
          ---
          EOF