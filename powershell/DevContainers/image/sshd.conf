# Read before the rest of sshd_config; sshd keeps the first value it sees.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers dev

# The key from Start-DevContainer, plus any the user adds to ~/.ssh/authorized_keys.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/intellij_authorized_keys

# IDEs reach their backend through an SSH port forward.
AllowTcpForwarding yes
ClientAliveInterval 60
